# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — https://render.com/docs/blueprint-spec
#
#  LORD-V4D3R is a static site: dependency-free ES modules in web/, with every
#  request going from the visitor's own browser to Anthropic. There is no
#  server, so this is a static site rather than a Docker web service.
#
#  That is strictly better than the container this replaces:
#    • no spin-down, so no cold start — a static site is always up
#    • no instance hours consumed
#    • served from Render's CDN
#
#  Push to GitHub, then Render → New → Blueprint → pick the repo.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: lord-v4d3r
    runtime: static
    # Nothing to compile — the console is ES modules and a committed vendor
    # bundle. `npm run vendor` is only needed after bumping the SDK.
    buildCommand: ''
    staticPublishPath: web
    autoDeployTrigger: commit

    headers:
      # The same policy the page carries in its own meta tag, applied at the
      # edge as well. `https:` in connect-src is what the http_request tool
      # costs; see the CSP note in web/index.html.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; base-uri 'none'; form-action 'self'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
